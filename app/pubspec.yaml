name: summitmate
description: "SummitMate (山友) - 嘉明湖登山行程助手"
publish_to: "none"
version: 0.0.10+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # UI
  cupertino_icons: ^2.0.0
  font_awesome_flutter: ^11.0.0
  photo_view: ^0.15.0
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.2

  # 本地資料庫
  drift: ^2.20.0
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # API 請求
  retrofit: ^4.4.1
  freezed_annotation: ^3.0.0

  # 狀態管理與依賴注入
  get_it: ^9.3.0

  # 工具套件
  intl: ^0.20.3
  uuid: ^4.5.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0

  # 程式碼生成輔助
  json_annotation: ^4.12.0
  flutter_slidable: ^5.2.0
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  gpx: ^2.3.0
  file_picker: ^13.4.0
  flutter_map_tile_caching: ^10.1.1
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  internet_connection_checker: ^3.0.1
  twicon: ^1.0.1
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  google_mobile_ads: ^9.2.0
  share_plus: ^13.3.1

  collection: ^1.19.1
  cached_network_image: ^4.0.7
  injectable: ^3.0.0
  meta: ^1.17.0
  rxdart: ^0.28.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift 程式碼生成
  drift_dev: ^2.20.0

  # 程式碼生成
  build_runner: ^2.13.1
  json_serializable: ^6.13.0
  freezed: ^4.0.3
  retrofit_generator: ^10.2.3

  # 視覺配置
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7

  # 測試工具
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  path_provider_platform_interface: any
  plugin_platform_interface: any
  injectable_generator: ^3.1.3

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0D2137"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0D2137"
  image: assets/icon.png
  android_12:
    image: assets/icon.png
    color: "#0D2137"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
