openapi: 3.0.3
info:
  title: SummitMate API
  version: 0.1.0
  description: |
    Offline-first sync API. Offline-first data (trips, members, itinerary, gear, meals)
    goes through /sync/*; there are no per-resource CRUD endpoints for it.
servers:
  - url: /api/v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      operationId: register
      summary: Create an account and send a verification code (no tokens issued)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created, verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the email with the 6-digit code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Verified; tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend the verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Sent if the account exists and is unverified }
        "429": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access and refresh token (rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the given refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Revoked }

  /auth/me:
    get:
      operationId: getMe
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMe
      summary: Update display name and avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMe
      summary: Deactivate the account and revoke all tokens
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deactivated }
        "401": { $ref: "#/components/responses/Error" }

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change password and revoke all refresh tokens
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /users/search:
    get:
      operationId: searchUsers
      summary: Find users by exact email (for inviting members)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Matching users (0 or 1)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicUser" }
        "401": { $ref: "#/components/responses/Error" }

  /sync/changes:
    get:
      operationId: pullChanges
      summary: Pull rows changed since a timestamp (including tombstones)
      description: |
        `since` is used as given. The client subtracts a 5 second overlap only for the
        first request of a sync run, then follows `next_since` unchanged.
        Applying rows is idempotent, so overlapping pages are harmless.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /sync/push:
    post:
      operationId: pushOps
      summary: Apply a batch of client operations (idempotent by op_id)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
      responses:
        "200":
          description: One result per operation, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /weather/forecast:
    get:
      operationId: getWeatherForecast
      summary: Daily weather forecast for a coordinate (Open-Meteo, cached on the server)
      description: |
        Proxies and caches Open-Meteo. `elevation` (metres) corrects temperatures for mountain
        locations. Responds 502 `weather_unavailable` when the upstream fails and nothing usable is cached.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: elevation
          in: query
          required: false
          schema: { type: number, format: double, minimum: 0, maximum: 9000 }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 16, default: 7 }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /explore/mountains:
    get:
      operationId: getExploreMountains
      summary: Read-only mountain reference data (public, no token)
      description: |
        Static dataset embedded in the server binary; changes only with a deploy. Guests may call it.
        The data is compiled from public sources and NOT yet reviewed (`verified` is false for every entry).
        Responds with a strong `ETag`; send it back in `If-None-Match` to get 304 with no body.
        Entries are sorted by elevation (descending) then id.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Mountain dataset
          headers:
            ETag: { schema: { type: string }, description: Strong validator of the dataset }
            Cache-Control: { schema: { type: string }, description: "public, max-age=3600" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MountainDataset" }
        "304":
          description: Not modified (If-None-Match matched), no body

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string }
        code: { type: string }
        message: { type: string }
        param: { type: string }

    User:
      type: object
      required: [id, email, display_name, avatar, is_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar: { type: string }
        is_verified: { type: boolean }

    PublicUser:
      type: object
      required: [id, display_name, avatar]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, maxLength: 255 }

    RegisterResponse:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    UpdateProfileRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, maxLength: 255 }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds }

    AuthResponse:
      type: object
      required: [tokens, user]
      properties:
        tokens: { $ref: "#/components/schemas/TokenPair" }
        user: { $ref: "#/components/schemas/User" }

    SyncEntity:
      type: string
      enum: [trips, trip_members, itinerary_items, gear_items, meal_plan_days, meal_items]

    # Rows are returned as JSON objects whose keys are the column names of the table.
    # Tombstones have a non-null deleted_at.
    ChangesResponse:
      type: object
      required: [server_time, next_since, has_more, changes]
      properties:
        server_time: { type: string, format: date-time }
        next_since: { type: string, format: date-time }
        has_more: { type: boolean }
        changes:
          type: object
          description: Map of entity name to changed rows
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true

    PushRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PushOp" }

    PushOp:
      type: object
      required: [op_id, entity, entity_id, type]
      properties:
        op_id: { type: string, format: uuid, description: Idempotency key }
        entity: { $ref: "#/components/schemas/SyncEntity" }
        entity_id: { type: string, format: uuid }
        type: { type: string, enum: [upsert, delete] }
        patch:
          type: object
          description: Only the changed fields (field-level last-write-wins). Ignored for delete.
          additionalProperties: true

    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/PushResult" }

    PushResult:
      type: object
      required: [op_id, status]
      properties:
        op_id: { type: string, format: uuid }
        status:
          type: string
          enum: [applied, gone, forbidden, invalid]
        message: { type: string }
        row:
          type: object
          description: Canonical server row after applying (status = applied)
          additionalProperties: true

    WeatherForecast:
      type: object
      required: [latitude, longitude, elevation, timezone, fetched_at, daily]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        elevation: { type: number, format: double, nullable: true, description: Metres, as used by Open-Meteo }
        timezone: { type: string, example: Asia/Taipei }
        fetched_at: { type: string, format: date-time, description: When the server fetched it from upstream }
        daily:
          type: array
          items: { $ref: "#/components/schemas/WeatherDay" }

    WeatherDay:
      type: object
      required: [date, weather_code, temp_max, temp_min, precipitation_probability_max, precipitation_sum, wind_speed_max, wind_gusts_max]
      properties:
        date: { type: string, format: date }
        weather_code: { type: integer, description: WMO weather code }
        temp_max: { type: number, format: double, description: °C }
        temp_min: { type: number, format: double, description: °C }
        precipitation_probability_max: { type: integer, nullable: true, description: "%" }
        precipitation_sum: { type: number, format: double, description: mm }
        wind_speed_max: { type: number, format: double, description: km/h }
        wind_gusts_max: { type: number, format: double, nullable: true, description: km/h }

    MountainDataset:
      type: object
      required: [version, updated_at, mountains]
      properties:
        version: { type: string, description: 'Dataset version, e.g. "2026-11-22.1"' }
        updated_at: { type: string, format: date-time }
        mountains:
          type: array
          items: { $ref: "#/components/schemas/Mountain" }

    Mountain:
      type: object
      required: [id, name, name_en, elevation, region, latitude, longitude, category, difficulty, beginner_friendly, summary, permit, verified, sources]
      properties:
        id: { type: string, description: Stable lowercase ascii slug }
        name: { type: string, description: Traditional Chinese }
        name_en: { type: string, nullable: true }
        elevation: { type: integer, description: Metres }
        region: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        category: { type: string, enum: [baiyue, other] }
        difficulty: { type: string, nullable: true, enum: [easy, moderate, hard, expert] }
        beginner_friendly: { type: boolean }
        summary: { type: string }
        permit: { type: string, nullable: true }
        verified: { type: boolean, description: True only after a human reviewed the entry }
        sources:
          type: array
          items: { type: string }
