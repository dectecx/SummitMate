openapi: 3.0.3
info:
  title: SummitMate API
  version: 0.1.0
  description: |
    Offline-first sync API. Offline-first data (trips, members, itinerary, gear, meals)
    goes through /sync/*; there are no per-resource CRUD endpoints for it.
servers:
  - url: /api/v1

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  /auth/register:
    post:
      operationId: register
      summary: Create an account and send a verification code (no tokens issued)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created, verification code sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the email with the 6-digit code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: Verified; tokens issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Resend the verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Sent if the account exists and is unverified }
        "429": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Exchange a refresh token for a new access and refresh token (rotation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the given refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Revoked }

  /auth/me:
    get:
      operationId: getMe
      summary: Current user profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    put:
      operationId: updateMe
      summary: Update display name and avatar
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMe
      summary: Deactivate the account and revoke all tokens
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deactivated }
        "401": { $ref: "#/components/responses/Error" }

  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change password and revoke all refresh tokens
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /users/search:
    get:
      operationId: searchUsers
      summary: Find users by exact email (for inviting members)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Matching users (0 or 1)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicUser" }
        "401": { $ref: "#/components/responses/Error" }

  /trips/{trip_id}/transfer-owner:
    post:
      operationId: transferTripOwner
      summary: Hand a trip over to another member (owner only). The previous owner becomes a guide.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: trip_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnerRequest" }
      responses:
        "204": { description: Transferred }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /sync/changes:
    get:
      operationId: pullChanges
      summary: Pull rows changed since a timestamp (including tombstones)
      description: |
        `since` is used as given. The client subtracts a 5 second overlap only for the
        first request of a sync run, then follows `next_since` unchanged.
        Applying rows is idempotent, so overlapping pages are harmless.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        "401": { $ref: "#/components/responses/Error" }

  /sync/push:
    post:
      operationId: pushOps
      summary: Apply a batch of client operations (idempotent by op_id)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRequest" }
      responses:
        "200":
          description: One result per operation, in order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /weather/forecast:
    get:
      operationId: getWeatherForecast
      summary: Daily weather forecast for a coordinate (Open-Meteo, cached on the server)
      description: |
        Proxies and caches Open-Meteo. `elevation` (metres) corrects temperatures for mountain
        locations. Responds 502 `weather_unavailable` when the upstream fails and nothing usable is cached.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: elevation
          in: query
          required: false
          schema: { type: number, format: double, minimum: 0, maximum: 9000 }
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 16, default: 7 }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /explore/mountains:
    get:
      operationId: getExploreMountains
      summary: Read-only mountain reference data (public, no token)
      description: |
        Static dataset embedded in the server binary; changes only with a deploy. Guests may call it.
        The data is compiled from public sources and NOT yet reviewed (`verified` is false for every entry).
        Responds with a strong `ETag`; send it back in `If-None-Match` to get 304 with no body.
        Entries are sorted by elevation (descending) then id.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Mountain dataset
          headers:
            ETag: { schema: { type: string }, description: Strong validator of the dataset }
            Cache-Control: { schema: { type: string }, description: "public, max-age=3600" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MountainDataset" }
        "304":
          description: Not modified (If-None-Match matched), no body

  /explore/shops:
    get:
      operationId: getExploreShops
      summary: Outdoor and hiking gear shops (public, no token)
      description: |
        Static list embedded in the server binary; changes only with a deploy. Only shops rated 4.0 or higher on
        Google Maps when last checked are listed. Responds with a strong `ETag`; send it back in `If-None-Match`
        to get 304 with no body. Sorted by city then id.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Shop dataset
          headers:
            ETag: { schema: { type: string }, description: Strong validator of the dataset }
            Cache-Control: { schema: { type: string }, description: "public, max-age=3600" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShopDataset" }
        "304":
          description: Not modified (If-None-Match matched), no body

  /shared-sets:
    get:
      operationId: listSharedSets
      summary: List cloud shared gear sets (scope=public needs no token)
      description: |
        `scope=public` returns public and protected sets (never private), newest first; a valid token is
        optional and only used to fill `mine`. `scope=mine` requires a token and returns the caller's
        sets of every visibility. An invalid token on this path is rejected with 401.
      parameters:
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [public, mine] }
        - name: q
          in: query
          required: false
          description: Case-insensitive title substring
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` of the previous page
          schema: { type: string }
      responses:
        "200":
          description: One page of summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSetPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createSharedSet
      summary: Share a gear set to the cloud
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSharedSetRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSetSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /shared-sets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSharedSet
      summary: Read a shared set with its items (token optional)
      description: |
        Public sets are readable by everyone, private sets only by the owner (404 for others),
        protected sets by the owner or with the correct `X-Access-Key`
        (403 `access_key_required` when missing, 403 `invalid_access_key` when wrong,
        429 `too_many_requests` after too many wrong keys).
        An invalid token on this path is rejected with 401.
      parameters:
        - name: X-Access-Key
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Set with items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedSetDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSharedSet
      summary: Delete one of my shared sets (soft delete)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /group-events:
    get:
      operationId: listGroupEvents
      summary: List group events (scopes all, upcoming and popular need no token)
      description: |
        `all`: not cancelled, newest first. `upcoming`: not cancelled and `start_date` today or later, soonest first.
        `popular`: not cancelled, by like_count + approved_count, then newest. `joined`: events where the caller's
        application is pending or approved (cancelled events included). `hosting`: the caller's own events (cancelled
        included). `joined` and `hosting` require a token (401 otherwise). A token is optional for the other scopes and
        fills `liked`, `my_status` and `is_host`; an invalid token is rejected with 401. `q` matches title or location.
        `private_message` is never part of a summary.
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [all, upcoming, popular, joined, hosting], default: all }
        - name: q
          in: query
          required: false
          description: Case-insensitive title or location substring
          schema: { type: string, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          description: Opaque `next_cursor` of the previous page (same scope and q)
          schema: { type: string }
      responses:
        "200":
          description: One page of summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEventPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroupEvent
      summary: Create a group event (the caller becomes the host)
      description: |
        When `linked_trip_id` is set the caller must be the owner of that live trip (403 `not_trip_owner`).
        A bad `trip_snapshot` is 400 `invalid_snapshot`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupEventRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEventDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /group-events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getGroupEvent
      summary: Read a group event (token optional)
      description: |
        A cancelled event is only visible to its host and to users who ever applied (404 `group_event_not_found`
        for everyone else). `private_message` is null and `private_message_locked` true unless the caller is the
        host or an approved applicant. `linked_trip_id` is only returned to the host. An invalid token is rejected with 401.
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEventDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateGroupEvent
      summary: Edit a group event (host only)
      description: |
        Absent fields are unchanged. `end_date`, `linked_trip_id` and `trip_snapshot` can be cleared with an explicit
        null. `status` may only be set to open or closed (use DELETE to cancel). `max_members` cannot go below the
        current approved count. Changing `linked_trip_id` does not touch existing trip members.
        A cancelled event cannot be edited (409 `event_cancelled`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateGroupEventRequest" }
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEventDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: cancelGroupEvent
      summary: Cancel a group event (host only; status becomes cancelled, idempotent)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /group-events/{id}/apply:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: applyGroupEvent
      summary: Apply to join (or apply again after a rejection or cancellation)
      description: |
        409 codes: `host_cannot_apply`, `already_applied` (pending or approved), `registration_closed`
        (closed, cancelled or already started), `event_full` (only when the event needs no approval).
        Without approval the application is approved at once and the applicant joins the linked trip.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyRequest" }
      responses:
        "200":
          description: Resulting application status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    delete:
      operationId: withdrawGroupEventApplication
      summary: Cancel my pending application or leave (approved members leave the linked trip too)
      description: 404 `application_not_found` when the caller has no pending or approved application.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Cancelled }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /group-events/{id}/applications:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listGroupEventApplications
      summary: Application list (host only), oldest first
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          description: Filter by one status; default is pending and approved
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /group-events/{id}/applications/{appId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: appId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeGroupEventMember
      summary: Remove an approved member (host only); the member leaves the linked trip
      description: 409 `invalid_review` when the application is not approved.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /group-events/{id}/applications/{appId}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: appId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewGroupEventApplication
      summary: Approve or reject a pending application (host only)
      description: |
        409 `invalid_review` when the application is not pending (or the event is cancelled),
        409 `event_full` when approving a full event. Approving adds the applicant to the linked trip as a member.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewRequest" }
      responses:
        "200":
          description: Reviewed application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Application" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /group-events/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listGroupEventComments
      summary: Public comments, oldest first (token optional)
      description: A valid token fills `mine`; an invalid token is rejected with 401.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: One page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: createGroupEventComment
      summary: Post a public comment
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /group-events/{id}/comments/{commentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: commentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteGroupEventComment
      summary: Delete a comment (author or host, soft delete)
      description: 404 `comment_not_found` when the comment is missing or already deleted.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /group-events/{id}/like:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: likeGroupEvent
      summary: Like (idempotent)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: unlikeGroupEvent
      summary: Remove my like (idempotent)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LikeState" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /reports:
    post:
      operationId: createReport
      summary: Report a group event or a comment
      description: |
        The target must exist and be visible to the caller (404 `group_event_not_found` / `comment_not_found`).
        201 the first time, 200 when the caller already reported the same target (nothing new is stored).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReportRequest" }
      responses:
        "200":
          description: Already reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "201":
          description: Reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /friends:
    get:
      operationId: listFriends
      summary: My friends and the pending requests I received or sent
      description: Only active, verified people appear. E-mail is never exposed.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Friends and requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendList" }
        "401": { $ref: "#/components/responses/Error" }

  /friends/requests:
    post:
      operationId: sendFriendRequest
      summary: Ask someone to be friends
      description: |
        201 when a new request was stored, or when the other person had already asked me (then it is accepted at once,
        status `accepted`). 200 when nothing changed: already friends (`accepted`) or I already asked (`pending`).
        400 `cannot_friend_self`, 404 `user_not_found` (unknown or inactive), 429 when more than 20 new requests
        were sent within an hour, 409 `too_many_pending_requests` when 100 requests of mine are still pending.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendFriendRequest" }
      responses:
        "200":
          description: Nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestResult" }
        "201":
          description: Created or accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FriendRequestResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /friends/requests/{request_id}:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: removeFriendRequest
      summary: Decline (addressee) or cancel (requester) a pending request
      description: 404 `friend_request_not_found` when it does not exist, is already accepted, or is not mine.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /friends/requests/{request_id}/accept:
    parameters:
      - name: request_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: acceptFriendRequest
      summary: Accept a request I received
      description: |
        404 `friend_request_not_found` when it does not exist or is already accepted,
        403 `forbidden` when I am not the addressee.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Accepted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /friends/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: unfriend
      summary: Remove a friend (idempotent)
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed or not a friend }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string }
        code: { type: string }
        message: { type: string }
        param: { type: string }

    User:
      type: object
      required: [id, email, display_name, avatar, is_verified]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar: { type: string }
        is_verified: { type: boolean }

    Shop:
      type: object
      required: [id, name, city, district, address, phone, google_maps_url, hours, website, shop_url, categories, rating, rating_count, checked_on]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string, description: County or city }
        district: { type: string }
        address: { type: string }
        phone: { type: string, nullable: true }
        google_maps_url: { type: string, format: uri }
        hours: { type: string, nullable: true, description: Opening hours as free text }
        website: { type: string, format: uri, nullable: true, description: The shop's own website or page }
        shop_url: { type: string, format: uri, nullable: true, description: An online store of the shop (own store, Shopee, ...) }
        categories:
          type: array
          items: { type: string, enum: ["登山裝備", "服飾", "食物", "露營", "潛水", "攀岩", "其他"] }
        rating: { type: number, minimum: 4, maximum: 5, description: Google Maps rating when checked }
        rating_count: { type: integer, nullable: true }
        checked_on: { type: string, format: date }

    ShopDataset:
      type: object
      required: [version, updated_at, shops]
      properties:
        version: { type: string }
        updated_at: { type: string, format: date-time }
        shops:
          type: array
          items: { $ref: "#/components/schemas/Shop" }

    PublicUser:
      type: object
      required: [id, display_name, avatar]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, maxLength: 255 }

    RegisterResponse:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{6}$" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, maxLength: 72 }

    TransferOwnerRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid, description: The member who becomes the owner }

    UpdateProfileRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        avatar: { type: string, maxLength: 255 }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Access token lifetime in seconds }

    AuthResponse:
      type: object
      required: [tokens, user]
      properties:
        tokens: { $ref: "#/components/schemas/TokenPair" }
        user: { $ref: "#/components/schemas/User" }

    SharedVisibility:
      type: string
      enum: [public, protected, private]

    SharedItem:
      type: object
      required: [kind, name, category, weight, quantity, note]
      properties:
        kind: { type: string, enum: [gear, meal] }
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, maxLength: 50, description: Gear category, or meal type for meals }
        weight: { type: number, format: double, minimum: 0, description: Grams }
        quantity: { type: integer, minimum: 0, maximum: 9999 }
        calories: { type: number, format: double, minimum: 0, description: kcal, meals only }
        day: { type: integer, minimum: 1, maximum: 60, description: Day number, meals only }
        note: { type: string, maxLength: 1000 }

    SharedSetSummary:
      type: object
      required: [id, title, author_name, visibility, total_weight, gear_count, meal_count, created_at, mine]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        author_name: { type: string }
        visibility: { $ref: "#/components/schemas/SharedVisibility" }
        total_weight: { type: number, format: double, description: Grams, gear only, including quantity }
        gear_count: { type: integer }
        meal_count: { type: integer }
        created_at: { type: string, format: date-time }
        mine: { type: boolean }

    SharedSetDetail:
      allOf:
        - $ref: "#/components/schemas/SharedSetSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SharedItem" }

    SharedSetPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SharedSetSummary" }
        next_cursor: { type: string, description: Absent on the last page }

    CreateSharedSetRequest:
      type: object
      required: [title, visibility, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        visibility: { $ref: "#/components/schemas/SharedVisibility" }
        access_key: { type: string, description: "Required for protected (4-12 ASCII letters/digits), forbidden otherwise" }
        items:
          type: array
          minItems: 1
          maxItems: 300
          items: { $ref: "#/components/schemas/SharedItem" }

    SyncEntity:
      type: string
      enum: [trips, trip_members, itinerary_items, gear_items, meal_plan_days, meal_items, library_items, templates, trip_messages, polls, poll_options, poll_votes, favorites]

    # Rows are returned as JSON objects whose keys are the column names of the table.
    # Tombstones have a non-null deleted_at.
    ChangesResponse:
      type: object
      required: [server_time, next_since, has_more, changes]
      properties:
        server_time: { type: string, format: date-time }
        next_since: { type: string, format: date-time }
        has_more: { type: boolean }
        changes:
          type: object
          description: Map of entity name to changed rows
          additionalProperties:
            type: array
            items:
              type: object
              additionalProperties: true

    PushRequest:
      type: object
      required: [ops]
      properties:
        ops:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/PushOp" }

    PushOp:
      type: object
      required: [op_id, entity, entity_id, type]
      properties:
        op_id: { type: string, format: uuid, description: Idempotency key }
        entity: { $ref: "#/components/schemas/SyncEntity" }
        entity_id: { type: string, format: uuid }
        type: { type: string, enum: [upsert, delete] }
        patch:
          type: object
          description: Only the changed fields (field-level last-write-wins). Ignored for delete.
          additionalProperties: true

    PushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/PushResult" }

    PushResult:
      type: object
      required: [op_id, status]
      properties:
        op_id: { type: string, format: uuid }
        status:
          type: string
          enum: [applied, gone, forbidden, invalid]
        message: { type: string }
        row:
          type: object
          description: Canonical server row after applying (status = applied)
          additionalProperties: true

    WeatherForecast:
      type: object
      required: [latitude, longitude, elevation, timezone, fetched_at, daily]
      properties:
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        elevation: { type: number, format: double, nullable: true, description: Metres, as used by Open-Meteo }
        timezone: { type: string, example: Asia/Taipei }
        fetched_at: { type: string, format: date-time, description: When the server fetched it from upstream }
        daily:
          type: array
          items: { $ref: "#/components/schemas/WeatherDay" }

    WeatherDay:
      type: object
      required: [date, weather_code, temp_max, temp_min, precipitation_probability_max, precipitation_sum, wind_speed_max, wind_gusts_max]
      properties:
        date: { type: string, format: date }
        weather_code: { type: integer, description: WMO weather code }
        temp_max: { type: number, format: double, description: °C }
        temp_min: { type: number, format: double, description: °C }
        precipitation_probability_max: { type: integer, nullable: true, description: "%" }
        precipitation_sum: { type: number, format: double, description: mm }
        wind_speed_max: { type: number, format: double, description: km/h }
        wind_gusts_max: { type: number, format: double, nullable: true, description: km/h }

    MountainDataset:
      type: object
      required: [version, updated_at, mountains]
      properties:
        version: { type: string, description: 'Dataset version, e.g. "2026-11-22.1"' }
        updated_at: { type: string, format: date-time }
        mountains:
          type: array
          items: { $ref: "#/components/schemas/Mountain" }

    Mountain:
      type: object
      required: [id, name, name_en, elevation, region, latitude, longitude, category, trail_grade, beginner_friendly, summary, permit, verified, sources]
      properties:
        id: { type: string, description: Stable lowercase ascii slug }
        name: { type: string, description: Traditional Chinese }
        name_en: { type: string, nullable: true }
        elevation: { type: integer, description: Metres }
        region: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        category: { type: string, enum: [baiyue, other] }
        trail_grade: { type: integer, nullable: true, minimum: 0, maximum: 6, description: "Raw national-park trail grade (0-6, https://www.ysnp.gov.tw/StaticPage/TrailsG) as stated by the cited source; null if none. No difficulty label is provided." }
        beginner_friendly: { type: boolean }
        summary: { type: string }
        permit: { type: string, nullable: true }
        verified: { type: boolean, description: True only after a human reviewed the entry }
        sources:
          type: array
          items: { type: string }

    GroupEventCategory:
      type: string
      enum: [hiking, camping, bouldering, other]

    GroupEventStatus:
      type: string
      enum: [open, closed, cancelled]

    ApplicationStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]

    FriendList:
      type: object
      required: [friends, incoming, outgoing]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friend" }
        incoming:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }
        outgoing:
          type: array
          items: { $ref: "#/components/schemas/FriendRequest" }

    Friend:
      type: object
      required: [user_id, display_name, avatar, since]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }
        since: { type: string, format: date-time, description: When the request was accepted }

    FriendRequest:
      type: object
      required: [request_id, user, created_at]
      properties:
        request_id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/PublicUser", description: The other person }
        created_at: { type: string, format: date-time }

    SendFriendRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string, format: uuid }

    FriendRequestResult:
      type: object
      required: [status, request_id]
      properties:
        status: { type: string, enum: [pending, accepted] }
        request_id: { type: string, format: uuid }

    # Public profile of a person on a group event. Never carries an email. The id lets the app offer "add friend".
    EventUser:
      type: object
      required: [id, display_name, avatar]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        avatar: { type: string }

    GroupEventSummary:
      type: object
      required: [id, title, category, location, start_date, end_date, max_members, approved_count, pending_count, like_count, comment_count, status, approval_required, host, created_at, liked, my_status, is_host]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: "#/components/schemas/GroupEventCategory" }
        location: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        max_members: { type: integer }
        approved_count: { type: integer }
        pending_count: { type: integer, description: Applications waiting for review; 0 unless the caller is the host }
        like_count: { type: integer }
        comment_count: { type: integer }
        status: { $ref: "#/components/schemas/GroupEventStatus" }
        approval_required: { type: boolean }
        host: { $ref: "#/components/schemas/EventUser" }
        created_at: { type: string, format: date-time }
        liked: { type: boolean, description: False without a token }
        my_status:
          type: string
          nullable: true
          description: "The caller's application status (pending, approved, rejected, cancelled), null if never applied or no token"
        is_host: { type: boolean }

    GroupEventDetail:
      allOf:
        - $ref: "#/components/schemas/GroupEventSummary"
        - type: object
          required: [description, private_message, private_message_locked, my_rejection_reason, linked_trip_id, trip_snapshot, snapshot_updated_at]
          properties:
            description: { type: string }
            private_message: { type: string, nullable: true, description: Null unless the caller is the host or an approved applicant }
            private_message_locked: { type: boolean, description: True when private_message is hidden from the caller }
            my_rejection_reason: { type: string, nullable: true, description: Only for the applicant whose application was rejected with a reason }
            linked_trip_id: { type: string, format: uuid, nullable: true, description: Only returned to the host }
            trip_snapshot:
              allOf:
                - $ref: "#/components/schemas/TripSnapshot"
              nullable: true
            snapshot_updated_at: { type: string, format: date-time, nullable: true }

    GroupEventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/GroupEventSummary" }
        next_cursor: { type: string, description: Absent on the last page }

    # Display-only copy of a trip plan. At most 200 itinerary nodes and 64 KB in total (400 invalid_snapshot).
    TripSnapshot:
      type: object
      required: [name, start_date, end_date, itinerary]
      properties:
        name: { type: string, maxLength: 200 }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
        itinerary:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/TripSnapshotNode" }

    TripSnapshotNode:
      type: object
      required: [day, name, time, altitude, lat, lng]
      properties:
        day: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 200 }
        time: { type: string, nullable: true, maxLength: 20, description: 'e.g. "07:00"' }
        altitude: { type: integer, description: Metres }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }

    CreateGroupEventRequest:
      type: object
      required: [title, category, start_date, max_members]
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        category: { $ref: "#/components/schemas/GroupEventCategory" }
        location: { type: string, maxLength: 200 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        max_members: { type: integer, minimum: 2, maximum: 100 }
        approval_required: { type: boolean, default: true }
        description: { type: string, maxLength: 4000 }
        private_message: { type: string, maxLength: 2000 }
        linked_trip_id: { type: string, format: uuid, nullable: true }
        trip_snapshot: { $ref: "#/components/schemas/TripSnapshot" }

    UpdateGroupEventRequest:
      type: object
      properties:
        title: { type: string, minLength: 5, maxLength: 200 }
        category: { $ref: "#/components/schemas/GroupEventCategory" }
        location: { type: string, maxLength: 200 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        max_members: { type: integer, minimum: 2, maximum: 100 }
        approval_required: { type: boolean }
        description: { type: string, maxLength: 4000 }
        private_message: { type: string, maxLength: 2000 }
        status: { type: string, enum: [open, closed] }
        linked_trip_id: { type: string, format: uuid, nullable: true }
        trip_snapshot: { $ref: "#/components/schemas/TripSnapshot" }

    ApplyRequest:
      type: object
      properties:
        message: { type: string, maxLength: 500 }

    ApplyResponse:
      type: object
      required: [my_status]
      properties:
        my_status: { $ref: "#/components/schemas/ApplicationStatus" }

    Application:
      type: object
      required: [id, user, status, message, created_at]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/EventUser" }
        status: { $ref: "#/components/schemas/ApplicationStatus" }
        message: { type: string }
        created_at: { type: string, format: date-time }

    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Application" }

    ReviewRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        reason: { type: string, maxLength: 500, description: Shown to the applicant when rejecting }

    Comment:
      type: object
      required: [id, user, body, created_at, mine]
      properties:
        id: { type: string, format: uuid }
        user: { $ref: "#/components/schemas/EventUser" }
        body: { type: string }
        created_at: { type: string, format: date-time }
        mine: { type: boolean }

    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: string, description: Absent on the last page }

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 1000 }

    LikeState:
      type: object
      required: [liked, like_count]
      properties:
        liked: { type: boolean }
        like_count: { type: integer }

    CreateReportRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type: { type: string, enum: [group_event, group_event_comment] }
        target_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }

    Report:
      type: object
      required: [id, target_type, target_id, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [group_event, group_event_comment] }
        target_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
