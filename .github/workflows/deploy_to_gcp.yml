name: Deploy Backend to GCP Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_to_gcp.yml'
  workflow_dispatch: # 允許手動觸發

env:
  REGION: us-central1
  SERVICE_NAME: summitmate-api
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: us-central1-docker.pkg.dev/summitmate/summitmate-repo/api
  RUNTIME_SA: summitmate-runtime-sa@summitmate.iam.gserviceaccount.com

jobs:
  # ─────────────────────────────────────────
  # Job 1: Run Tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v7

      - name: 🐹 Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'

      - name: 📦 Download Dependencies
        run: go mod download

      - name: 🔍 Vet
        run: go vet ./...

      - name: 🧪 Run Unit Tests
        # Sync integration tests are skipped unless TEST_DATABASE_URL is set; no database is needed here.
        run: go test ./...

      - name: 🔍 Verify Generated Code is Up-to-Date
        # Tool versions are pinned to the ones that produced the committed files
        # (see the header of api/gen.go and internal/store/db.go).
        run: |
          (cd api && go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.2 --config=oapi-codegen.yaml openapi.yaml)
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          git diff --exit-code -- api/gen.go internal/store

  # ─────────────────────────────────────────
  # Job 2: Build & Deploy (only after tests pass)
  #
  # 目前暫停部署到 GCP：僅在 repository variable GCP_DEPLOY_ENABLED 為 'true' 時才會執行。
  # 要恢復部署，請在 GitHub 的 Settings > Secrets and variables > Actions > Variables 新增該變數。
  #
  # 需要的 GitHub Secrets（沿用既有名稱）：GCP_WORKLOAD_IDENTITY_PROVIDER、GCP_SERVICE_ACCOUNT
  # 需要的 GCP Secret Manager secrets（runtime SA 需有 secretAccessor）：
  #   - JWT_SECRET    至少 32 字元
  #   - DATABASE_URL  postgres://USER:PASS@HOST:5432/DB?sslmode=...（Cloud SQL 可用 unix socket host 形式）
  #   資料庫需 PostgreSQL 18+，且須事先用 `migrate`（映像內 /app/migrate，工作目錄 /app）套用 schema 到空資料庫；
  #   本 workflow 不會自動執行 migration。
  #
  # 已知限制：ENV=production 目前無法啟動（尚未選定寄信服務，程式回傳 "production mailer is not configured"）。
  # config 只接受 development|production，因此在寄信服務就緒前，這裡暫以 ENV=development 部署，
  # 此模式的驗證碼只會印在 log、不會寄出，僅供測試用，勿用於正式流量。寄信服務就緒後改為 ENV=production。
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: test
    if: ${{ vars.GCP_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v7

      - name: 🔐 Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: ☁️ Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: 🐳 Docker Auth
        uses: 'docker/login-action@v4'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      - name: 🏗️ Build Docker Image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: 📤 Push to Artifact Registry
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: 🚀 Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --service-account=${{ env.RUNTIME_SA }} \
            --set-env-vars="ENV=development" \
            --set-secrets="JWT_SECRET=JWT_SECRET:latest,DATABASE_URL=DATABASE_URL:latest" \
            --quiet

      - name: ✅ Output Deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "🎉 Deployed: ${URL}"
          echo "::notice title=Deployed URL::${URL}"
